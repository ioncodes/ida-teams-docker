services:
  hexvault:
    build:
      context: .
      dockerfile: Dockerfile.Hexvault
    platform: linux/amd64
    restart: unless-stopped
    mac_address: "${HEXVAULT_MAC_ADDRESS:-02:42:ac:10:00:02}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HEXVAULT_PORT:-65433}:65433"
    volumes:
      - hexvault:/opt/hexvault/files
      - hexvault-tls:/opt/hexvault/tls

  lumina:
    build:
      context: .
      dockerfile: Dockerfile.Lumina
    platform: linux/amd64
    restart: unless-stopped
    mac_address: "${LUMINA_MAC_ADDRESS:-02:42:ac:10:00:03}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${LUMINA_PORT:-443}:65432"
    depends_on:
      lumina-mysql:
        condition: service_healthy
    networks:
      - default
      - internal_db
    volumes:
      - lumina-tls:/opt/lumina/tls

  lumina-mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_USER: lumina
      MYSQL_PASSWORD: lumina
      MYSQL_ROOT_PASSWORD: lumina
      MYSQL_DATABASE: lumina
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u lumina lumina -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - internal_db
    volumes:
      - lumina:/var/lib/mysql

networks:
  internal_db:
    internal: true

volumes:
  lumina:
  hexvault:
  lumina-tls:
  hexvault-tls:
